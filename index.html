<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS Compare – Supplier vs Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --border: #ddd8d0;
    --text: #1a1714;
    --muted: #7a746c;
    --accent: #c94a2e;
    --accent-light: #f9ede9;
    --mismatch: #c94a2e;
    --only-left: #e8f0fe;
    --only-right: #fef3e2;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrapper {
    max-width: 1200px;
    margin: 0 auto;
  }

  header { margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
  header p { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 640px) {
    .input-grid { grid-template-columns: 1fr; }
  }

  .input-block label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    font-family: var(--mono);
    font-size: 12.5px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    min-height: 220px;
    line-height: 1.7;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { background: var(--bg); }

  .error-msg { font-size: 12px; color: var(--accent); margin-top: 10px; display: none; }

  .output-section { display: none; }
  .output-section.visible { display: block; }

  .table-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .table-header-row span {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .copy-btn {
    font-size: 12px;
    padding: 5px 12px;
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid #e8bfb5;
    border-radius: 5px;
    cursor: pointer;
  }
  .copy-btn:hover { opacity: 0.8; }

  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
  }
  .dot-mismatch { background: #fce8e6; border: 1px solid #f5c6c2; }
  .dot-only-a { background: var(--only-left); border: 1px solid #c5d8fc; }
  .dot-only-b { background: var(--only-right); border: 1px solid #fdd9a0; }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 600px;
  }

  thead tr { border-bottom: 2px solid var(--text); }
  thead th {
    text-align: left;
    padding: 8px 12px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  thead th.group-header {
    text-align: center;
    border-bottom: none;
    padding-bottom: 2px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  thead .sub-header th {
    border-top: 1px solid var(--border);
    border-bottom: 2px solid var(--text);
  }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { filter: brightness(0.97); }

  tbody td {
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    vertical-align: middle;
  }

  tr.row-mismatch { background: #fce8e6; }
  tr.row-only-a   { background: var(--only-left); }
  tr.row-only-b   { background: var(--only-right); }

  .pms-mismatch { color: var(--mismatch); font-weight: 700; }

  .divider-col {
    width: 1px;
    background: var(--border);
    padding: 0 !important;
  }

  .skipped-note { font-size: 12px; color: var(--muted); margin-top: 10px; font-style: italic; }
  
  .empty-cell {
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <h1>Color List Comparator · Supplier vs Admin</h1>
    <p>Compare two PMS color lists. Rows are sorted alphabetically by color name.</p>
  </header>

  <div class="card">
    <div class="input-grid">
      <div class="input-block">
        <label>SUPPLIER LIST</label>
        <textarea id="listA"></textarea>
      </div>
      <div class="input-block">
        <label>ADMIN LIST</label>
        <textarea id="listB"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="doCompare()">Compare Lists</button>
      <button class="btn-ghost" onclick="clearCompare()">Clear</button>
    </div>
    <div class="error-msg" id="compareError"></div>
  </div>

  <div class="card output-section" id="compareOutput">
    <div class="table-header-row">
      <span>COMPARISON RESULT</span>
      <button class="copy-btn" onclick="copyCompare()">Copy as TSV</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot dot-mismatch"></div> PMS mismatch</div>
      <div class="legend-item"><div class="legend-dot dot-only-a"></div> Only in Supplier list</div>
      <div class="legend-item"><div class="legend-dot dot-only-b"></div> Only in Admin list</div>
    </div>
    <div class="table-wrap">
      <table id="compareTable">
        <thead>
          <tr>
            <th class="group-header" colspan="2">SUPPLIER</th>
            <th class="divider-col" rowspan="2"></th>
            <th class="group-header" colspan="2">ADMIN</th>
          </tr>
          <tr class="sub-header">
            <th>COLOR NAME</th>
            <th>PMS</th>
            <th>COLOR NAME</th>
            <th>PMS</th>
          </tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
    </div>
    <div class="skipped-note" id="compareSkipped"></div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────
//  PARSERS
// ─────────────────────────────────────────────────────────

function expandPrefix(name) {
  let result = name
    .replace(/\blt\.?/gi, 'Light')
    .replace(/\bdk\.?/gi, 'Dark')
    .replace(/\bmed\.?/gi, 'Medium');
  
  result = result.replace(/\bGrey\b/gi, 'Gray');
  result = result.replace(/\bGREY\b/gi, 'GRAY');
  
  return result;
}

function niceCase(str) {
  if (!str) return '';
  let result = str.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w).join(' ');
  result = result.replace(/\bGrey\b/g, 'Gray');
  return result;
}

function fixGray(name) {
  if (!name) return name;
  return name.replace(/\bGrey\b/gi, 'Gray');
}

function escHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function keyOf(name) {
  let normalized = name.toLowerCase().trim().replace(/\s+/g, ' ');
  normalized = normalized.replace(/mediumium/g, 'medium');
  normalized = normalized.replace(/grey/g, 'gray');
  return normalized;
}

function isProcessColor(name) {
  return name && name.toLowerCase().startsWith('process ');
}

// Clean Pantone - remove "Pantone" word and handle duplicates like "Yellow Yellow" -> "Yellow"
function cleanPantone(name) {
  if (!name) return name;
  let cleaned = name.replace(/^Pantone\s+/i, '');
  const words = cleaned.split(' ');
  if (words.length >= 2 && words[0].toLowerCase() === words[1].toLowerCase()) {
    return words[0];
  }
  return cleaned;
}

// Admin list name transformations
function transformAdminName(name) {
  if (!name) return name;
  // Reflex Blue -> Dark Blue
  if (name.toLowerCase() === 'reflex blue') {
    return 'Dark Blue';
  }
  // Process Blue -> Light Blue
  if (name.toLowerCase() === 'process blue') {
    return 'Light Blue';
  }
  return name;
}

// ─────────────────────────────────────────────────────────
//  SUPPLIER PARSER
// ─────────────────────────────────────────────────────────
function parseSupplierLine(raw) {
  let line = raw.replace(/^[\s*\-•]+/, '').trim();
  if (!line) return null;

  const lower = line.toLowerCase();
  if (lower === 'black') return { name: 'Black', pms: 'Process Black' };
  if (lower === 'white') return { name: 'White', pms: 'White' };

  const qualRe = /\b(lt\.?|dk\.?|med\.?)\s+(\w+(?:\s+\w+)*)/i;
  const qualMatch = line.match(qualRe);
  if (qualMatch) {
    const qualToken = qualMatch[1];
    let colorAfter = qualMatch[2];
    const beforeQual = line.slice(0, qualMatch.index).trim();
    let pmsValue = '';
    const numMatch = beforeQual.match(/\b(\d+[\w]*)\b/);
    if (numMatch) {
      pmsValue = numMatch[1];
    } else if (beforeQual) {
      let cleaned = beforeQual.replace(/\b(pms|pantone)\b\s*/gi, '').trim();
      if (cleaned) pmsValue = niceCase(cleaned);
    }
    const expandedQual = expandPrefix(qualToken);
    let colorNameRaw = expandedQual + ' ' + colorAfter;
    colorNameRaw = colorNameRaw.replace(/\s+/g, ' ').trim();
    let colorName = niceCase(colorNameRaw);
    colorName = colorName.replace(/Mediumium/gi, 'Medium');
    colorName = fixGray(colorName);
    colorName = cleanPantone(colorName);
    
    if (isProcessColor(colorName)) {
      const processBase = colorName.split(' ').slice(0, 2).join(' ');
      return { name: processBase, pms: processBase };
    }
    return { name: colorName, pms: pmsValue };
  }

  let stripped = line.replace(/^(pms|pantone)\s*/i, '').trim();
  const numMatch2 = stripped.match(/^(\d+[\w]*)\s+(.+)$/);
  if (numMatch2) {
    let rawName = expandPrefix(numMatch2[2]);
    let cleanName = niceCase(rawName);
    cleanName = cleanName.replace(/Mediumium/gi, 'Medium');
    cleanName = fixGray(cleanName);
    cleanName = cleanPantone(cleanName);
    
    if (isProcessColor(cleanName)) {
      const processBase = cleanName.split(' ').slice(0, 2).join(' ');
      return { name: processBase, pms: processBase };
    }
    return { name: cleanName, pms: numMatch2[1] };
  }

  let finalFallback = expandPrefix(stripped);
  finalFallback = niceCase(finalFallback).replace(/Mediumium/gi, 'Medium');
  finalFallback = fixGray(finalFallback);
  finalFallback = cleanPantone(finalFallback);
  
  if (isProcessColor(finalFallback)) {
    const processBase = finalFallback.split(' ').slice(0, 2).join(' ');
    return { name: processBase, pms: processBase };
  }
  return { name: finalFallback, pms: '' };
}

// ─────────────────────────────────────────────────────────
//  ADMIN PARSER
// ─────────────────────────────────────────────────────────
function parseAdminLine(raw) {
  let line = raw.trim();
  if (!line) return null;

  let columns = line.split('\t');
  let firstColumn = columns[0].trim();
  if (!firstColumn) return null;
  
  if (firstColumn.toLowerCase() === 'pms color match') return { name: 'PMS Color Match', pms: '' };
  if (firstColumn.toLowerCase() === 'black') return { name: 'Black', pms: 'Process Black' };
  if (firstColumn.toLowerCase() === 'white') return { name: 'White', pms: 'White' };
  
  let nameValue = firstColumn;
  let pmsValue = '';
  
  const numberMatch = firstColumn.match(/(\d+[\w]*)\s*$/);
  if (numberMatch) {
    pmsValue = numberMatch[1];
    nameValue = firstColumn.replace(/\s*\d+[\w]*\s*$/, '').trim();
  }
  
  if (!pmsValue && columns.length >= 2) {
    let secondCol = columns[1].trim();
    if (secondCol && secondCol.toLowerCase() !== 'null' && secondCol !== '') {
      pmsValue = secondCol;
    }
  }
  
  let expanded = expandPrefix(nameValue);
  let nameClean = niceCase(expanded);
  nameClean = nameClean.replace(/Mediumium/gi, 'Medium');
  nameClean = fixGray(nameClean);
  
  // Apply Admin name transformations
  nameClean = transformAdminName(nameClean);
  
  let pmsClean = pmsValue;
  if (pmsValue && !/^\d+[\w]*$/.test(pmsValue)) {
    pmsClean = pmsValue.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
    pmsClean = fixGray(pmsClean);
  }
  
  if (isProcessColor(nameClean) && (!pmsClean || pmsClean === '')) {
    pmsClean = nameClean;
  }
  
  if (!nameClean && firstColumn) {
    nameClean = niceCase(expandPrefix(firstColumn));
    nameClean = fixGray(nameClean);
    nameClean = transformAdminName(nameClean);
  }
  
  return { name: nameClean, pms: pmsClean };
}

function parseBlock(text, parserFn) {
  const rows = [];
  const skipped = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) continue;
    const r = parserFn(line);
    if (r && r.name) {
      rows.push(r);
    } else {
      skipped.push(i + 1);
    }
  }
  return { rows, skipped };
}

// ─────────────────────────────────────────────────────────
//  MAIN COMPARE
// ─────────────────────────────────────────────────────────
function doCompare() {
  const textA = document.getElementById('listA').value;
  const textB = document.getElementById('listB').value;
  if (!textA.trim() && !textB.trim()) { 
    showErr('compareError', 'Please paste at least one list.'); 
    return; 
  }
  hideErr('compareError');

  const { rows: rowsA, skipped: skipA } = parseBlock(textA, parseSupplierLine);
  const { rows: rowsB, skipped: skipB } = parseBlock(textB, parseAdminLine);

  const uniqueAdmin = [];
  const seenAdminKeys = new Set();
  for (const row of rowsB) {
    const key = keyOf(row.name);
    if (!seenAdminKeys.has(key)) {
      seenAdminKeys.add(key);
      uniqueAdmin.push(row);
    }
  }
  
  const mapA = {};
  for (const row of rowsA) {
    mapA[keyOf(row.name)] = row;
  }
  
  const mapB = {};
  for (const row of uniqueAdmin) {
    mapB[keyOf(row.name)] = row;
  }
  
  const allKeys = new Set([...Object.keys(mapA), ...Object.keys(mapB)]);
  
  const sortedKeys = Array.from(allKeys).sort((a, b) => {
    const aLast = a === 'pms color match';
    const bLast = b === 'pms color match';
    if (aLast && !bLast) return 1;
    if (!aLast && bLast) return -1;
    return a.localeCompare(b);
  });

  const tbody = document.getElementById('compareBody');
  tbody.innerHTML = '';

  for (const key of sortedKeys) {
    const a = mapA[key] || null;
    const b = mapB[key] || null;
    
    const supplierName = a ? a.name : '';
    const supplierPMS = a ? a.pms : '';
    const adminName = b ? b.name : '';
    const adminPMS = b ? b.pms : '';

    const onlyA = a && !b;
    const onlyB = !a && b;
    const pmsMatch = a && b && a.pms.trim().toLowerCase() === b.pms.trim().toLowerCase();
    const mismatch = a && b && !pmsMatch;

    let rowClass = '';
    if (mismatch) rowClass = 'row-mismatch';
    else if (onlyA) rowClass = 'row-only-a';
    else if (onlyB) rowClass = 'row-only-b';

    const supplierPMSCell = mismatch ? `<span class="pms-mismatch">${escHtml(supplierPMS)}</span>` : escHtml(supplierPMS);
    const adminPMSCell = mismatch ? `<span class="pms-mismatch">${escHtml(adminPMS)}</span>` : escHtml(adminPMS);
    
    const supplierNameDisplay = supplierName ? escHtml(supplierName) : '<span class="empty-cell">—</span>';
    const adminNameDisplay = adminName ? escHtml(adminName) : '<span class="empty-cell">—</span>';

    const tr = document.createElement('tr');
    if (rowClass) tr.className = rowClass;
    tr.innerHTML = `
      <td>${supplierNameDisplay}</td>
      <td>${supplierPMSCell || '<span class="empty-cell">—</span>'}</td>
      <td class="divider-col"></td>
      <td>${adminNameDisplay}</td>
      <td>${adminPMSCell || '<span class="empty-cell">—</span>'}</td>
    `;
    tbody.appendChild(tr);
  }

  let notes = [];
  if (skipA.length) notes.push(`Supplier: ${skipA.length} line(s) skipped (lines: ${skipA.join(', ')})`);
  if (skipB.length) notes.push(`Admin: ${skipB.length} line(s) skipped (lines: ${skipB.join(', ')})`);
  
  document.getElementById('compareSkipped').textContent = notes.join(' · ');
  document.getElementById('compareOutput').classList.add('visible');
}

function copyCompare() {
  const rows = document.querySelectorAll('#compareTable tbody tr');
  const tsv = ['SUPPLIER NAME\tSUPPLIER PMS\tADMIN NAME\tADMIN PMS'];
  for (const row of rows) {
    const cells = Array.from(row.querySelectorAll('td')).filter(cell => !cell.classList.contains('divider-col'));
    const textContents = cells.map(cell => cell.textContent.trim().replace(/—/g, ''));
    tsv.push(textContents.join('\t'));
  }
  const btn = document.querySelector('#compareOutput .copy-btn');
  navigator.clipboard.writeText(tsv.join('\n')).then(() => {
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = orig, 1500);
    }
  });
}

function clearCompare() {
  document.getElementById('listA').value = '';
  document.getElementById('listB').value = '';
  document.getElementById('compareOutput').classList.remove('visible');
  hideErr('compareError');
  document.getElementById('compareSkipped').textContent = '';
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

function hideErr(id) {
  document.getElementById(id).style.display = 'none';
}
</script>
</body>
</html>
